<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Programa</title>
    <style>
        body{
            background-color: rgb(92, 92, 253);/* comentário de CSS */
            color: white;
            font: 20pt arial;
            }
        h1{
            color: rgb(245, 190, 9);
        }
    </style>
</head>
<body>
  <h1>Olá,mundo!</h1> <!-- comentário de html -->
  <p>Explorando o universo</p>
  <script>
      var nome = window.prompt('Qual é seu nome?')// vai perguntar o nome!
      window.alert('É um grande prazer em te conhecer ' + nome +"!")// o + nesse caso irá concatenar!
  </script>
</body>
</html>
