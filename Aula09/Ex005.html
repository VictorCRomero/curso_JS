<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: rgb(68, 125, 199);
            color: white;
            font: normal 18pt Arial;
        }
    </style>
</head>
<body>
    <h1> Iniciando estudo DOM</h1>
    <p> Aqui vai o resultado </p>
    <p> aprendendo a usar o <strong>DOM</strong> em Java Script. </p>
    <div id = 'msg'> clique em mim </div>
    <script> 
        window.document.write(window.navigator.appName + '<br/>') // escreve informações do navegador 
        window.document.write(window.document.URL + '<br/>')
        window.document.write(' Olá, mundo! <br/>') // Não é a melhor forma de colocar no navegador
        var p1 = window.document.getElementsByTagName('p')[1] // Os valores começam com [0] depois [1] ...
		window.document.write('Está escrito assim: ' + p1.innerText + '<br/>')// só demostra o texto sem as configurações ex:fica sem negrito.
		window.document.write('Está escrito assim: ' + p1.innerHTML + '<br/>')// demostra o texto com as configurações ex:fica negrito.
		p1.style.color = 'black'
		var corpo = window.document.body
		corpo.style.background = 'blue'
		/* var d = window.document.getElementById('msg')
		d.style.background= 'green' 
		tome cuidado mais a frente por conta do escopo essa forma de formar var */
		// var d = window.document.getElementsByName('msg')[0]
		var d = window.document.querySelector('div#msg')
		d.style.background = 'green'
		// var d = window.document.querySelectorall('div#msg') [0] se tiver mais de um 
		// perceba se trocarmos o id pelo class temos que trocar # por . ex: ('div.msg')
	</script>
</body>
</html>
